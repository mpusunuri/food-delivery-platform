# ================================================
# FOOD DELIVERY PLATFORM - CI/CD PIPELINE
# ================================================
# Triggers: Push to main/dev, PR to main
# Jobs: SonarCloud, Test, Security Scan, Build Docker, Deploy
# ================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  DOCKER_IMAGE_BACKEND: food-backend
  DOCKER_IMAGE_FRONTEND: food-frontend

jobs:
  # ================================================
  # JOB 0: SonarCloud Quality Analysis
  # ================================================
  sonarcloud:
    name: SonarCloud Quality Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Tests with Coverage
        run: |
          cd backend
          npm test -- --coverage --coverageReporters=lcov
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: fooddelivery
          NODE_ENV: test

      - name: Display Coverage Report (Debug)
        run: |
          echo "=== Checking coverage files ==="
          ls -la backend/coverage/ || echo "No coverage directory!"
          echo "=== Looking for lcov.info ==="
          find backend -name "lcov.info" || echo "lcov.info not found!"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=mpusunuri
            -Dsonar.projectKey=mpusunuri_food-delivery-platform
            -Dsonar.sources=backend/src,frontend/src
            -Dsonar.tests=backend/src,frontend/src
            -Dsonar.test.inclusions=**/*.test.js
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/*.test.js

  # ================================================
  # JOB 1: Backend Testing
  # ================================================
  test-backend:
    name: Test Backend API
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: always()
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fooddelivery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Unit Tests
        run: |
          cd backend
          npm test
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: fooddelivery
          NODE_ENV: test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/coverage/
          retention-days: 7

  # ================================================
  # JOB 2: Security Scan - Backend Code
  # ================================================
  security-scan-backend:
    name: Security Scan - Backend
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy on Backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-backend-code.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Backend Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-code
          path: trivy-backend-code.sarif
          retention-days: 7

  # ================================================
  # JOB 3: Security Scan - Frontend Code
  # ================================================
  security-scan-frontend:
    name: Security Scan - Frontend
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './frontend'
          format: 'sarif'
          output: 'trivy-frontend-code.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Frontend Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-code
          path: trivy-frontend-code.sarif
          retention-days: 7

  # ================================================
  # JOB 4: Build & Push Docker Images
  # ================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, security-scan-backend, security-scan-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_BACKEND }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_BACKEND }}:latest
          format: 'sarif'
          output: 'trivy-backend-image.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_FRONTEND }}:latest
          format: 'sarif'
          output: 'trivy-frontend-image.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Image Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-scans
          path: trivy-*-image.sarif
          retention-days: 7

  # ================================================
  # JOB 5: Deployment (Coming Week 4)
  # ================================================
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to EKS
        run: |
          echo "=========================================="
          echo "Deployment will be implemented in Week 4"
          echo "=========================================="
          echo "📦 Target: AWS EKS Cluster"
          echo "🔄 Strategy: Blue-Green Deployment"
          echo "🌐 Ingress: Nginx Ingress Controller"
          echo "=========================================="

  # ================================================
  # JOB 6: Notification
  # ================================================
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [sonarcloud, test-backend, security-scan-backend, security-scan-frontend]
    if: always()

    steps:
      - name: Check Pipeline Status
        run: |
          echo "=========================================="
          echo "📊 PIPELINE STATUS REPORT"
          echo "=========================================="
          
          if [ "${{ needs.sonarcloud.result }}" == "success" ]; then
            echo "✅ SonarCloud Quality Analysis: SUCCESS"
          else
            echo "❌ SonarCloud Quality Analysis: FAILED"
          fi
          
          if [ "${{ needs.test-backend.result }}" == "success" ]; then
            echo "✅ Test Backend API: SUCCESS"
          else
            echo "❌ Test Backend API: FAILED"
          fi
          
          if [ "${{ needs.security-scan-backend.result }}" == "success" ]; then
            echo "✅ Security Scan - Backend: SUCCESS"
          elif [ "${{ needs.security-scan-backend.result }}" == "skipped" ]; then
            echo "⏭️ Security Scan - Backend: SKIPPED"
          else
            echo "⚠️ Security Scan - Backend: COMPLETED WITH WARNINGS"
          fi
          
          if [ "${{ needs.security-scan-frontend.result }}" == "success" ]; then
            echo "✅ Security Scan - Frontend: SUCCESS"
          elif [ "${{ needs.security-scan-frontend.result }}" == "skipped" ]; then
            echo "⏭️ Security Scan - Frontend: SKIPPED"
          else
            echo "⚠️ Security Scan - Frontend: COMPLETED WITH WARNINGS"
          fi
          
          echo "=========================================="
          echo "✅ Pipeline completed!"
          echo "=========================================="