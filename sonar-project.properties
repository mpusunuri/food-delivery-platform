sonar.organization=mpusunuri
sonar.projectKey=mpusunuri_food-delivery-platform
sonar.projectName=Food Delivery Platform
sonar.projectVersion=1.0.0

# Sources
sonar.sources=backend/src,frontend/src

# Tests
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/*.test.js,**/*.spec.js

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300